<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기후 코어 시추단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#9BE8FF;--sky-mid:#4FC9FF;--sky-bot:#2A9BE0;
  --ink:#15283F;--muted:#4C6B88;
  --paper:#FFFFFF;--paper2:#EAF6FF;--line:#15283F;
  --sun:#FFD23F;--snow:#FFFFFF;
  --blue:#2E8FE6;--pink:#FF5C8A;--green:#23C06A;--purple:#8C6BFF;--gold:#FFC531;--orange:#FF9F43;
  --ok:#23C06A;--bad:#FF4D5E;--ice:#2E8FE6;--ocean:#2E8FE6;--warm:#FF7A3D;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;
  background:var(--sky-mid);
  background-image:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 42%,var(--sky-bot) 100%);
  background-attachment:fixed;overflow-x:hidden;image-rendering:pixelated;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
/* pixel grid + scanline overlay */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:32px 32px;}
/* pixel sun + snow ground scene */
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:64px;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,#E6F6FF 0 26px,#D2ECFF 26px 52px);
  border-top:5px solid var(--ink);}
h1,h2,h3,.disp{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 90px;position:relative;z-index:1}
.sub{color:#1E3A57;font-size:.9rem}
/* pixel buttons: hard border + offset shadow */
.btn{background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:5px;padding:12px 20px;font-family:"Do Hyeon",sans-serif;font-size:1.02rem;box-shadow:4px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn.g{background:var(--paper);color:var(--ink)}
.btn.gold{background:var(--gold);color:#5a4400}
.btn.gold:active{box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.4;box-shadow:2px 2px 0 var(--ink);transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.name{font:inherit;width:100%;max-width:360px;background:var(--paper);border:3px solid var(--ink);color:var(--ink);border-radius:5px;padding:12px 14px;box-shadow:3px 3px 0 var(--ink)}
/* title */
.scene-badge{display:inline-block;font-family:"Press Start 2P",monospace;font-size:.6rem;letter-spacing:1px;color:#fff;background:var(--pink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 10px;border-radius:4px;margin-bottom:14px}
.logo{font-family:"Do Hyeon",sans-serif;font-size:clamp(2.6rem,12vw,3.8rem);line-height:1;color:#fff;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),6px 6px 0 var(--pink);}
.tag{color:#15283F;font-family:"Do Hyeon",sans-serif;font-size:1.05rem;margin-top:12px;background:#FFFFFFcc;display:inline-block;padding:4px 12px;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink)}
/* world map */
.worlds{display:grid;gap:14px;margin-top:20px}
.world{display:flex;align-items:center;gap:14px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;padding:14px 16px;text-align:left;position:relative;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.world .depth{font-family:"Press Start 2P",monospace;font-size:.85rem;color:#fff;background:var(--blue);border:3px solid var(--ink);border-radius:5px;min-width:66px;padding:10px 4px;text-align:center;line-height:1.3}
.world .depth small{display:block;font-family:"IBM Plex Sans KR";font-size:.56rem;color:#EAF6FF;font-weight:600;margin-top:4px}
.world .meta{flex:1;min-width:0}
.world .wn{font-family:"Do Hyeon",sans-serif;font-size:1.12rem}
.world .wd{font-size:.82rem;color:var(--muted)}
.world .stars{font-size:1.05rem;letter-spacing:2px;color:var(--gold);text-shadow:1.5px 1.5px 0 var(--ink)}
.world.lock{opacity:.55;box-shadow:3px 3px 0 var(--ink)}
.world.lock .depth{background:#9DB4C8}
.world.clear{background:#E9FBF1;border-color:var(--ink)}
.world.clear .depth{background:var(--green)}
.world.playable{cursor:pointer}
.world.playable:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.badge{position:absolute;top:8px;right:10px;font-family:"Press Start 2P",monospace;font-size:.5rem;color:#fff;background:var(--green);border:2px solid var(--ink);padding:3px 5px;border-radius:3px}
/* hud */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;box-shadow:4px 4px 0 var(--ink)}
.hud .hearts{font-size:1.05rem;letter-spacing:1px}
.hud .sc{font-family:"Press Start 2P",monospace;font-size:.95rem;color:var(--orange)}
.hud .dp{font-size:.72rem;color:var(--muted);text-align:right;font-weight:600}
.hud .dp b{font-family:"Press Start 2P",monospace;font-size:.78rem;color:var(--blue)}
.pbar{height:14px;border:3px solid var(--ink);border-radius:6px;background:var(--paper2);overflow:hidden;margin:12px 0;box-shadow:3px 3px 0 var(--ink)}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 12px,#1FB862 12px 16px);transition:width .35s}
.combo{height:22px;text-align:center;margin:2px 0 8px;font-family:"Do Hyeon",sans-serif;color:var(--pink);font-size:1rem;transition:opacity .2s}
.combo .pop{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink)}
/* question card */
.q{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:18px 16px;box-shadow:6px 6px 0 var(--ink)}
.qtag{font-family:"Do Hyeon",sans-serif;font-size:.9rem;color:var(--muted);margin-bottom:10px;letter-spacing:.3px}
.qtxt{font-size:1.16rem;font-weight:600;line-height:1.45;margin-bottom:16px}
.gloss{background:#FFF6D6;border:3px solid var(--ink);border-radius:6px;padding:8px 12px;font-size:.84rem;color:#4a3b00;margin:0 0 14px;line-height:1.45;box-shadow:3px 3px 0 var(--ink)}
.gloss b{color:#8a6b00}
.revbar{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:8px;padding:11px 15px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.revbar b{font-family:"Do Hyeon",sans-serif;color:var(--ink);font-size:1.08rem}
/* learning goal */
.goal{display:flex;gap:9px;align-items:flex-start;background:#FFF6D6;border:3px solid var(--ink);border-radius:8px;padding:11px 14px;margin:12px 0 2px;font-size:.98rem;line-height:1.7;color:#4a3b00;box-shadow:3px 3px 0 var(--ink);overflow-wrap:break-word}
.goal .ic{flex:0 0 auto;font-size:1.1rem;margin-top:1px}
.goal .lb{color:#fff;background:#E0485F;font-weight:700;font-family:"Do Hyeon",sans-serif;border:2px solid var(--ink);border-radius:4px;padding:1px 7px;margin-right:4px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.goal.sm{margin:8px 0 0;background:#FFF6D6;border:2px solid var(--ink);border-radius:5px;padding:6px 10px;font-size:.84rem;color:#5a4a10;box-shadow:2px 2px 0 var(--ink)}
.goal.sm .lb{font-size:.72rem;box-shadow:1.5px 1.5px 0 var(--ink)}
.goal.play{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:3}
/* 학습목표 핵심 키워드 형광펜 강조 */
.kw{font-weight:700;color:#1b2e46;padding:0 2px;border-radius:2px;white-space:nowrap;
  box-shadow:inset 0 -0.5em 0 rgba(255,159,67,.55)}
.intro-quest .kw{box-shadow:inset 0 -0.5em 0 rgba(255,210,60,.7)}
/* options */
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:7px;padding:12px 14px;font-size:1rem;box-shadow:3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s,background .1s}
.opt:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.opt .k{width:28px;height:28px;flex:0 0 28px;border:2px solid var(--ink);border-radius:5px;background:var(--gold);display:grid;place-items:center;font-family:"Press Start 2P",monospace;font-size:.7rem;color:#5a4400}
.opt.ok{border-color:var(--ink);background:#CFF6E0}
.opt.ok .k{background:var(--green);color:#063d22}
.opt.no{border-color:var(--ink);background:#FFD9DD}
.opt.no .k{background:var(--bad);color:#4d0007}
.opt[disabled]{cursor:default}
.ox{grid-template-columns:1fr 1fr}
.ox .opt{justify-content:center;font-family:"Do Hyeon",sans-serif;font-size:1.35rem}
.ox .opt .k{display:none}
/* explanation */
.exp{margin-top:14px;padding:13px 15px;border:3px solid var(--ink);border-radius:8px;font-size:.95rem;line-height:1.5;box-shadow:3px 3px 0 var(--ink)}
.exp.ok{background:#CFF6E0}
.exp.no{background:#FFD9DD}
.exp .v{font-family:"Do Hyeon",sans-serif;font-size:1.05rem;display:block;margin-bottom:3px}
.exp.ok .v{color:#0a7a46}.exp.no .v{color:#b23038}
.next{margin-top:14px;width:100%;text-align:center}
/* flyscore */
.fly{position:fixed;font-family:"Press Start 2P",monospace;font-size:1.1rem;color:var(--gold);pointer-events:none;z-index:9;text-shadow:2px 2px 0 var(--ink)}
@keyframes flyup{0%{opacity:1;transform:translateY(0) scale(.9)}100%{opacity:0;transform:translateY(-70px) scale(1.25)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.shake{animation:shake .4s}
/* clear screen */
.clear-c{text-align:center;padding:10px 0}
.clear-c .big{font-family:"Do Hyeon",sans-serif;font-size:clamp(2rem,9vw,2.8rem);color:#fff;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),5px 5px 0 var(--gold)}
.starline{font-size:2.4rem;letter-spacing:8px;color:var(--gold);margin:12px 0;text-shadow:2px 2px 0 var(--ink)}
.starline .off{color:#B9D2E4;text-shadow:2px 2px 0 #7f98ab}
.stat{width:100%;max-width:360px;margin:14px auto;border-collapse:collapse;font-size:.95rem;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.stat td{border-bottom:2px solid var(--ink);padding:8px 10px}
.stat tr:last-child td{border-bottom:0}
.stat td:last-child{text-align:right;font-weight:700;color:var(--blue)}
.cert{border:3px solid var(--ink);border-radius:10px;padding:20px;background:var(--paper);margin-top:16px;text-align:center;box-shadow:6px 6px 0 var(--gold)}
.cert h2{color:#b28700;font-size:1.5rem}
/* snow pixels */
.snow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;background:#fff;border-radius:0;opacity:.95;box-shadow:0 0 0 1px rgba(21,40,63,.18);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh)}}
@media (prefers-reduced-motion: reduce){.snow{display:none}.fly{display:none}.shake{animation:none}*{transition:none!important}}
.tick{color:var(--ok)}.cross{color:var(--bad)}
/* dialog */
.ovl{position:fixed;inset:0;z-index:20;background:#0E2A38bb;display:grid;place-items:center;padding:20px}
.dlg{max-width:340px;width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:22px;text-align:center;box-shadow:6px 6px 0 var(--ink)}
.dlg p{margin:0 0 18px;font-size:1.02rem}
.dlg .row{justify-content:center}
/* ===== 집중 모드: 문제 푸는 동안 외재적 자극 최소화 ===== */
body.focus{background-image:linear-gradient(180deg,#EDF4F8 0%,#DCEAF2 100%)}
body.focus::before{opacity:.3}
body.focus::after{display:none}
body.focus .snow{display:none}
/* ===== 만화풍 구간 브리핑(전두엽 목표 설정 화면) ===== */
.intro{position:relative;background:#141414;color:#fff;border:4px solid #000;border-radius:12px;padding:26px 20px 22px;text-align:center;overflow:hidden;box-shadow:8px 8px 0 #000;margin-top:16px}
.intro::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.7px);background-size:8px 8px;opacity:.55;pointer-events:none}
.intro::after{content:"";position:absolute;top:-40%;left:-10%;width:120%;height:60%;background:repeating-linear-gradient(115deg,transparent 0 16px,rgba(255,255,255,.05) 16px 20px);pointer-events:none}
.intro>*{position:relative;z-index:1}
.intro-sfx{font-family:"Press Start 2P",monospace;font-size:.72rem;letter-spacing:2px;color:#FFD23F;text-shadow:2px 2px 0 #000}
.intro-title{font-family:"Do Hyeon",sans-serif;font-size:clamp(2rem,10vw,3rem);color:#fff;margin:12px 0 6px;line-height:1.1;
  text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,3px 3px #000,-3px 3px #000,3px -3px #000,-3px -3px #000,7px 7px 0 #FF3D6E}
.intro-flavor{color:#cfe0ea;font-size:.92rem;max-width:460px;margin:8px auto 0;line-height:1.55}
.intro-quest{background:#fff;color:#141414;border:3px solid #000;border-radius:10px;padding:13px 15px;margin:16px auto 4px;max-width:520px;text-align:left;line-height:1.5;box-shadow:5px 5px 0 #000;font-weight:500}
.intro-quest .lb{display:block;font-family:"Press Start 2P",monospace;font-size:.55rem;color:#D4213D;margin-bottom:7px;letter-spacing:1px}
.intro-hp{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 6px;font-family:"Press Start 2P",monospace;font-size:.56rem;color:#fff}
.intro-hp .hpbar{width:180px;height:16px;border:3px solid #fff;background:#333;overflow:hidden}
.intro-hp .hpbar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,#fff 0 9px,#aaa 9px 13px);animation:hpfill 1.1s ease .1s both}
@keyframes hpfill{from{width:0}to{width:100%}}
.intro .press{margin:14px 6px 0;animation:blink 1.1s steps(2,jump-none) infinite}
.intro .btn.g{margin-top:8px;background:#fff}
@keyframes blink{50%{opacity:.55}}
/* ===== 돌파 보상(만화 효과음) ===== */
.clear-sfx{font-family:"Do Hyeon",sans-serif;font-size:clamp(1.6rem,8vw,2.4rem);color:#fff;letter-spacing:1px;
  text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,3px 3px #000,-3px -3px #000,6px 6px 0 var(--gold);transform:rotate(-3deg);margin-bottom:6px}
@media (prefers-reduced-motion: reduce){.intro .press{animation:none}.intro-hp .hpbar i{animation:none}}
.intro.gameover{background:#1a0d10;border-color:#4a1218}
.intro.gameover::before{background-image:radial-gradient(rgba(255,120,120,.14) 1.5px,transparent 1.7px)}
/* ===== 하트 1개 위험 경고 ===== */
.q.danger{border-color:#FF4D5E;box-shadow:6px 6px 0 #FF4D5E;animation:dangerpulse .9s ease-in-out infinite}
@keyframes dangerpulse{0%,100%{box-shadow:6px 6px 0 #FF4D5E}50%{box-shadow:6px 6px 0 #FF4D5E,0 0 20px 3px rgba(255,77,94,.55)}}
.hearts.low{display:inline-block;color:#FF4D5E;animation:beat .7s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}28%{transform:scale(1.28)}}
/* ===== 집중력 방전 연출 ===== */
.quake{animation:quake .5s}
@keyframes quake{10%{transform:translate(-5px,2px)}30%{transform:translate(6px,-4px)}50%{transform:translate(-6px,3px)}70%{transform:translate(5px,4px)}90%{transform:translate(-3px,-2px)}}
.crackfx{position:fixed;inset:0;z-index:30;pointer-events:none;display:grid;place-items:center;animation:crackflash .76s ease-out forwards;
  background-image:linear-gradient(126deg,transparent 48.5%,rgba(21,40,63,.85) 49.3% 50.5%,transparent 51.3%),linear-gradient(58deg,transparent 47.5%,rgba(21,40,63,.6) 48.6% 49.8%,transparent 50.8%),linear-gradient(-48deg,transparent 48.5%,rgba(21,40,63,.6) 49.3% 50.5%,transparent 51.3%)}
@keyframes crackflash{0%{opacity:0;background-color:rgba(255,255,255,0)}16%{opacity:1;background-color:rgba(255,255,255,.78)}100%{opacity:0;background-color:rgba(255,255,255,0)}}
.crack-sfx{font-family:"Do Hyeon",sans-serif;font-size:clamp(1.8rem,9vw,2.7rem);color:#fff;transform:rotate(-4deg);
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),6px 6px 0 #FF4D5E}
/* ===== 긴급 재학습 카드 ===== */
.dlg.relearn{text-align:left;max-width:400px}
.relearn-tag{font-family:"Do Hyeon",sans-serif;color:#D4213D;font-weight:700;text-align:center;margin-bottom:12px;font-size:1rem}
.relearn-q{font-weight:600;margin:0 0 10px;line-height:1.45}
.relearn-exp{background:#FFF6D6;border:3px solid var(--ink);border-radius:8px;padding:12px 14px;line-height:1.6;box-shadow:3px 3px 0 var(--ink);margin-bottom:16px}
.dlg.relearn .btn{width:100%}
.hardchip{display:inline-block;font-family:"Press Start 2P",monospace;font-size:.5rem;color:#fff;background:#E0485F;border:2px solid var(--ink);border-radius:4px;padding:2px 5px;vertical-align:middle;box-shadow:1.5px 1.5px 0 var(--ink);letter-spacing:.5px}
.intro-sfx .hardchip{border-color:#fff;box-shadow:1.5px 1.5px 0 #000}
/* ===== 난이도 선택 ===== */
.modehead{font-family:"Do Hyeon",sans-serif;font-size:1.05rem;color:#15283F;margin:4px 2px 8px}
.modehead span{font-family:"IBM Plex Sans KR";font-size:.82rem;color:#3E5B76;font-weight:500}
.modepick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modecard{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:13px 13px 12px;box-shadow:4px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;opacity:.7}
.modecard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.modecard.on{opacity:1;box-shadow:5px 5px 0 var(--blue)}
.modecard.hard.on{box-shadow:5px 5px 0 #E0485F}
.mc-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.mc-ic{font-size:1.15rem}
.mc-nm{font-family:"Do Hyeon",sans-serif;font-size:1.02rem;color:#15283F}
.mc-chk{margin-left:auto;font-family:"Press Start 2P",monospace;font-size:.42rem;color:#fff;background:var(--blue);border:2px solid var(--ink);border-radius:3px;padding:2px 4px;opacity:0}
.modecard.on .mc-chk{opacity:1}
.modecard.hard.on .mc-chk{background:#E0485F}
.mc-dc{font-size:.84rem;line-height:1.45;color:#2b3f52}
.mc-dc b{color:#15283F}
.mc-tag{margin-top:7px;font-size:.72rem;color:#5B7794;border-top:2px dotted var(--line);padding-top:6px}
.modecard.hard .mc-nm{color:#C0334A}
@media (max-width:420px){.modepick{grid-template-columns:1fr}}
.mastery{background:#141414;color:#fff;border:3px solid var(--ink);border-radius:10px;padding:13px 15px;margin:14px auto;max-width:460px;line-height:1.55;box-shadow:5px 5px 0 var(--gold);position:relative}
.mastery b{color:#FFD23F}
.stars.master{font-size:1.5rem;color:#FFC531;text-shadow:2px 2px 0 var(--ink),0 0 10px rgba(255,197,49,.75)}
.badge.gold{background:var(--gold);color:#6a4e00;font-size:.44rem}

<script>
const O='¹⁸O',P='¹⁶O',R='¹⁸O/¹⁶O';
const mc=(q,o,e)=>({t:'mc',q,o,e});     // o[0] = 정답
const ox=(q,a,e,qn)=>({t:'ox',q,a,e,qn});     // a=true 이면 'O(옳다)'가 정답

/* 각 월드 = 개념 그룹 배열. 그룹 안의 변형은 틀렸을 때 다른 발문으로 재출제 */
const WORLDS=[
{id:'w1',name:'과거 기후 읽기',pg:'8쪽',depth:'-20m',
 goal:'<b class="kw">빙하 코어</b>·<b class="kw">화석</b>·<b class="kw">나이테</b>·<b class="kw">꽃가루</b>·<b class="kw">산호</b> 같은 자료로 <b class="kw">과거의 기후</b>를 어떻게 알아내는지 설명할 수 있다.',
 groups:[
  [ox('기후는 오랜 기간에 걸쳐 나타나는 날씨의 평균적 상태이다.',true,'일기는 며칠 동안의 날씨, 기후는 그 평균적 상태.','기후는 며칠 동안의 날씨 변화를 뜻한다.'),
   ox('"오늘 오후부터 비가 온다"는 기후에 대한 설명이다.',false,'그건 며칠 동안의 날씨, 즉 일기.','"오늘 오후부터 비가 온다"는 기후가 아니라 일기(날씨)에 대한 설명이다.')],
  [mc('빙하 코어 '+R+' 비가 X>Y였다. 더 온난했던 시기는?',['X','Y','알 수 없다','둘이 같다'],'온난할수록 무거운 '+O+'도 증발→눈→빙하. 빙하의 비가 높으면 온난기.'),
   ox('빙하 속 '+R+' 비가 높을수록 그 시기는 온난했다.',true,'온난기엔 '+O+'가 활발히 증발해 빙하에 쌓인다.','빙하 속 '+R+' 비가 높을수록 그 시기는 한랭했다.')],
  [mc('기후가 점점 한랭해졌다. 빙하와 해양 화석 속 '+O+'는?',['빙하↓ 화석↑','빙하↑ 화석↑','빙하↑ 화석↓','빙하↓ 화석↓'],'한랭기엔 '+O+'가 덜 증발→빙하로 덜 가고 바다에 남는다.'),
   mc('기후가 점점 온난해졌다. 빙하와 해양 화석 속 '+O+'는?',['빙하↑ 화석↓','빙하↑ 화석↑','빙하↓ 화석↑','빙하↓ 화석↓'],'온난기엔 '+O+'가 활발히 증발해 빙하↑, 바다엔 적게 남아 화석↓.')],
  [ox('한랭기에는 증발한 물이 육지 빙하로 묶여 해수면이 낮아진다.',true,'바다로 돌아가지 못한 물이 많아져 해수량이 준다.','한랭기에는 증발한 물이 육지 빙하로 묶여 해수면이 높아진다.'),
   mc('온난기에 해수면이 높아지는 까닭은?',['육지 빙하가 녹아 물이 바다로 돌아와서','바닷물이 증발해서','염분이 높아져서','해저 화산이 늘어서'],'육지 빙하(빙상·빙하)가 녹아 바다로 돌아오면 해수면이 오른다. 바다에 떠 있는 해빙은 녹아도 해수면이 거의 변하지 않는다.')],
  [mc('빙하 속 기포를 분석해 직접 알 수 있는 것은?',['당시 대기 조성','당시 평균 수심','당시 동물 종류','당시 지진 횟수'],'눈이 다져질 때 갇힌 공기 = 당시 대기 샘플.'),
   ox('빙하 속 기포로 과거 대기 중 이산화 탄소 농도를 알 수 있다.',true,'기포는 얼음이 될 때 갇힌 그 시절의 공기.','빙하 속 기포로는 과거 대기 조성을 전혀 알 수 없다.')],
  [mc('어느 10년간 나이테 폭이 평년보다 좁았다. 그 시기는?',['춥거나 건조했다','덥고 비가 많았다','나무가 나이를 안 먹었다','해수면이 높았다'],'나무는 따뜻하고 비 많을수록 넓은 나이테. 좁으면 성장 불리.'),
   ox('폭이 넓은 나이테는 따뜻하고 강수량이 많았던 시기를 뜻한다.',true,'성장에 유리할수록 나이테가 넓다.','폭이 넓은 나이테는 춥고 건조했던 시기를 뜻한다.')],
  [mc('한 퇴적층을 아래(오래된 과거)→위(최근)로 보니 소나무 꽃가루↑ 동백나무 꽃가루↓. 시간에 따른 기후 변화는?',['점점 한랭','점점 온난','변화 없음','강수만 증가'],'퇴적층은 아래가 과거·위가 최근. 침엽수(소나무)↑ 상록활엽수(동백)↓ = 점점 추워짐.'),
   mc('한 퇴적층을 아래(오래된 과거)→위(최근)로 보니 동백나무 꽃가루↑ 소나무 꽃가루↓. 시간에 따른 기후 변화는?',['점점 온난','점점 한랭','변화 없음','빙하기 시작'],'퇴적층은 아래가 과거·위가 최근. 상록활엽수(동백)↑ 침엽수(소나무)↓ = 점점 따뜻해짐.')],
  [ox('산호는 수온이 높을수록 빨리 자란다.',true,'수온↑일수록 성장선이 넓게·빠르게 자란다. 이 성장률로 과거 수온을 추정한다.','산호는 수온이 낮을수록 빨리 자란다.'),
   mc('기록과 주로 추정하는 정보의 연결이 틀린 것은?',['산호 성장률 → 과거 대기 조성','나이테 → 기온·강수량','빙하 기포 → 대기 조성','꽃가루 → 기온 경향'],'산호로는 과거 수온을 추정. 대기 조성은 빙하 기포.')],
  [ox('나이테로는 나무가 자라지 않았던 시기의 기후를 알 수 없다.',true,'기록은 그걸 남긴 주체가 존재한 기간만 담는다.','나이테로는 나무가 자라지 않았던 시기의 기후까지 모두 알 수 있다.')]
 ]},
{id:'w2',name:'기후변화 요인',pg:'9쪽 위',depth:'-55m',
 goal:'<b class="kw">자전축 기울기</b>·<b class="kw">수륙 분포</b>·<b class="kw">지표 반사율</b>의 변화가 기후를 어떻게 바꾸는지 설명할 수 있다.',
 groups:[
  [mc('기후변화 요인이 아닌 것은?',['달의 공전 주기 변화','자전축 기울기 변화','수륙 분포 변화','지표의 성질 변화'],'요인: 자전축 기울기, 수륙 분포, 지표 성질.'),
   ox('대륙 이동(수륙 분포 변화)은 기후변화 요인이다.',true,'해류·빙하 분포를 바꿔 기후에 영향.','대륙 이동(수륙 분포 변화)은 기후변화와 아무 관련이 없다.')],
  [mc('자전축 기울기가 커지면 중위도의 연교차는?',['커진다','작아진다','변화 없다','0이 된다'],'여름 태양↑ 겨울 태양↓ 로 차이가 벌어진다.'),
   mc('자전축 기울기가 작아지면 중위도의 연교차는?',['작아진다','커진다','변화 없다','계절이 바뀐다'],'여름·겨울 고도 차가 줄어 연교차 감소.')],
  [mc('햇빛을 가장 많이 흡수하는 표면은?',['토양','눈','빙하','셋 다 같다'],'밝을수록 반사율↑ 흡수↓. 가장 어두운 토양이 반사율이 작아 가장 많이 흡수.')],
  [mc('북극 해빙이 녹아 어두운 바다가 드러났다. 이어질 변화는?',['반사율↓ 흡수↑ 기온 상승','반사율↑ 흡수↓ 기온 하강','반사율↑ 흡수↑','변화 없음'],'밝은 얼음→어두운 바다: 반사↓ 흡수↑.'),
   mc('눈 덮인 면적이 넓어졌다. 이어질 변화는?',['반사율↑ 흡수↓ 기온 하강','반사율↓ 흡수↑ 기온 상승','반사율↓ 흡수↓','변화 없음'],'밝은 눈이 많으면 반사↑ 흡수↓.')]
 ]},
{id:'w3',name:'복사 평형·열수지',pg:'9쪽 아래',depth:'-95m',
 goal:'지구의 <b class="kw">복사 평형</b>을 이해하고, <b class="kw">위도별 에너지 과잉·부족</b>과 그 <b class="kw">수송</b>을 설명할 수 있다.',
 groups:[
  [mc('태양에서 지구로 오는 복사는 주로 어떤 영역?',['가시광선','적외선','전파','감마선'],'태양 복사는 주로 가시광선.')],
  [mc('지구가 우주로 내보내는 복사는 주로 어떤 영역?',['적외선','가시광선','자외선','X선'],'온도 낮은 지구는 주로 적외선 방출.')],
  [mc('태양 복사 100 중 30이 반사됐다. 복사 평형일 때 방출량은?',['70','100','30','133'],'흡수 70 = 방출 70.'),
   ox('복사 평형이면 지구가 흡수하는 양과 방출하는 양이 같다.',true,'그래서 평균 기온이 일정하게 유지.','복사 평형이어도 지구가 흡수하는 양이 방출하는 양보다 많다.')],
  [mc('적도처럼 흡수>방출인 지역의 상태는?',['에너지 과잉','에너지 부족','에너지 0','평형과 무관'],'저위도: 흡수>방출 → 남는다.'),
   mc('극지방처럼 방출>흡수인 지역의 상태는?',['에너지 부족','에너지 과잉','에너지 0','평형과 무관'],'고위도: 방출>흡수 → 모자란다.')],
  [mc('저위도에 에너지가 남는데도 계속 뜨거워지지 않는 까닭은?',['대기·해수 순환이 고위도로 수송','저위도엔 햇빛이 없어서','반사율이 100%여서','고위도가 열을 보내서'],'순환이 과잉 에너지를 고위도로 옮긴다.'),
   ox('대기와 해수의 순환이 약해지면 저위도·고위도 기온 차가 커진다.',true,'수송이 줄면 남는 곳·모자란 곳 격차가 벌어진다.','대기와 해수의 순환이 약해지면 저위도·고위도 기온 차가 작아진다.')]
 ]},
{id:'w4',name:'온실효과·지구 온난화',pg:'10쪽',depth:'-130m',
 goal:'<b class="kw">온실효과</b>의 원리를 이해하고, <b class="kw">온실 기체</b> 증가로 강화되는 <b class="kw">지구 온난화</b>의 과정과 영향을 설명할 수 있다.',
 groups:[
  [mc('지구 온난화가 심해지는 과정으로 옳은 것은?',['온실 기체가 늘어 지표 복사(적외선)를 더 많이 흡수·재복사 → 지표로 되돌아오는 에너지가 늘어 기온이 오른다','온실 기체가 태양의 가시광선을 직접 흡수해 대기를 데운다','온실 기체가 늘면 지구가 우주로 내보내는 적외선이 많아져 지표가 식는다','태양이 내보내는 에너지 자체가 커져서 기온이 오른다'],'온실 기체↑ → 지표가 낸 복사(적외선) 흡수·대기 재복사↑ → 지표로 되돌아오는 에너지↑ → 기온 상승. 태양 복사 자체가 커진 것이 아니다.'),
   ox('온실효과가 전혀 없다면 지구의 연평균 기온은 지금보다 낮을 것이다.',true,'지표로 되돌아오는 적외선이 없으면 훨씬 차가워진다.','온실효과가 전혀 없다면 지구의 연평균 기온은 지금보다 높을 것이다.')],
  [ox('대기가 있든 없든, 지구는 흡수한 태양 복사량과 방출하는 지구 복사량이 같은 복사 평형을 이룬다.',true,'대기 유무와 관계없이 지구 전체는 복사 평형(흡수=방출)이다. 온실효과는 평형을 깨는 것이 아니라 지표의 평형 온도를 높일 뿐이다.','대기가 있어야만 지구는 복사 평형을 이룰 수 있다.'),
   mc('온실효과가 지구의 복사 평형에 미치는 영향으로 옳은 것은?',['복사 평형(흡수=방출)은 그대로 이루되, 지표의 평형 온도를 높인다','지구가 복사 평형을 이루지 못하게 만든다','방출량을 0으로 만들어 끝없이 뜨거워지게 한다','지구가 받는 태양 복사량 자체를 늘린다'],'대기가 있든 없든 흡수=방출로 평형. 온실효과는 그 평형이 더 높은 지표 온도에서 이뤄지게 한다.')],
  [mc('같은 양일 때 온난화 기여도가 가장 큰 기체는?',['아산화 질소(273)','이산화 탄소(1)','메테인(27~30)','산소'],'기여도: 아산화질소 273 > 메테인 27~30 > 이산화탄소 1.')],
  [mc('실제 배출량 비율이 가장 큰 온실 기체는?',['이산화 탄소','메테인','아산화 질소','수소'],'화석 연료 사용으로 배출량이 가장 많은 건 이산화 탄소(약 75%). 수소는 온실 기체가 아니다.')],
  [mc('온실 기체가 주로 흡수하는 복사는?',['적외선','가시광선','자외선','모든 영역 동일'],'대기는 가시광선 통과, 적외선 선택 흡수.')],

/* sandbox-safe confirm (native confirm() is blocked in published artifacts) */
function askConfirm(msg,yesLabel,onYes){
  const o=document.createElement('div');o.className='ovl';
  o.innerHTML=`<div class="dlg"><p>${msg}</p><div class="row">
    <button class="btn gold" id="_y">${yesLabel}</button>
    <button class="btn g" id="_n">취소</button></div></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector('#_y').onclick=()=>{close();onYes();};
  o.querySelector('#_n').onclick=close;
  o.addEventListener('click',e=>{if(e.target===o)close();});
  o.querySelector('#_n').focus();
}

/* 교육과정 밖 용어 도움말 — 해당 단어가 보일 때만 설명을 띄운다 */
const GLOSS=[['용승','아래의 찬 해수가 표면으로 올라오는 현상']];
function glossFor(it){
  const vis=it.q+' '+(it.t==='mc'?it.o.join(' '):'');
  const hits=GLOSS.filter(([k])=>vis.includes(k));
  return hits.length?`<div class="gloss">💡 ${hits.map(([k,d])=>`<b>${k}</b> — ${d}`).join('<br>💡 ')}</div>`:'';
}

      <div class="mc-dc"><b>⭐ 모든 변형 문항</b> 출제(문항 수 ↑·약 2배)로 '완전 이해'에 도전. 하트를 다 쓰면 <b>그 구간을 처음부터</b> 다시.</div>
      <div class="mc-tag">많은 문항 · 더 깊은 이해 · GAME OVER</div>
    </button>
  </div>
  ${S.resume?(()=>{const rw=WORLDS.find(w=>w.id===S.resume.id);const dn=S.resume.total-S.resume.order.length;return `<div class="resumebar"><span>⏸ 이어하던 <b>${rw?rw.name:''}</b> · ${dn}/${S.resume.total}문항${S.resume.hard?' · ⚔하드':''}</span><span class="rb-btns"><button class="btn gold" data-resume style="padding:7px 14px">이어하기 ▶</button><button class="btn g" data-fresh style="padding:7px 12px">처음부터</button></span></div>`;})():''}
  <div class="worlds">
    ${WORLDS.map((w,i)=>{
      const open=unlocked(i),cl=S.stars[w.id];
      return `<div class="world ${open?'playable':'lock'} ${cl?'clear':''}" ${open?`data-go="${w.id}"`:''}>
        <div class="depth">${w.depth}<small>${w.pg}</small></div>
        <div class="meta"><div class="wn">${i+1}. ${w.name}</div>
        <div class="wd">${cl?'최고 '+(S.best[w.id]||0)+'점':open?'시추 가능':'🔒 앞 구간을 먼저 돌파'}</div>
        ${open?`<div class="goal sm"><span class="lb">목표</span> <span>${w.goal}</span></div>`:''}</div>
        <div class="stars ${S.hardClear[w.id]?'master':''}">${cl?starStr(S.stars[w.id]):''}</div>
        ${cl?(S.hardClear[w.id]?'<span class="badge gold">⭐ 완전이해</span>':'<span class="badge">돌파 ✓</span>'):''}
      </div>`;}).join('')}
    <div class="world ${cc>=6?'playable':'lock'} ${S.finalStars?'clear':''}" ${cc>=6?'data-go="final"':''}>
      <div class="depth">심층<small>종합</small></div>
      <div class="meta"><div class="wn">🏴 빙하 심층 챌린지</div>
      <div class="wd">${cc>=6?(S.finalStars?'최고 '+S.finalBest+'점':'모든 개념 혼합'):`🔒 6개 구간 전부 돌파 (${cc}/6)`}</div></div>
      <div class="stars">${S.finalStars?starStr(S.finalStars):''}</div>
    </div>
  </div>
  <p class="sub center" style="margin-top:18px">진행은 이 기기에 저장됩니다. · <button class="btn g" id="rs" style="padding:4px 10px">기록 초기화</button></p>
  <div class="byline bottom">${BYLINE}</div>`;
  document.getElementById('nm').oninput=e=>{S.name=e.target.value;save();};
  document.querySelectorAll('[data-hard]').forEach(b=>b.onclick=()=>{
    const nh=b.dataset.hard==='1';
    if(nh===S.hard)return;
    if(S.resume&&S.resume.hard!==nh){askConfirm('난이도를 바꾸면 <b>이어하던 진행</b>은 문항 구성이 달라 사라지고,<br>그 구간을 처음부터 다시 풀어야 합니다. 바꿀까요?','네, 바꿀게요',()=>{S.hard=nh;S.resume=null;save();home();});return;}
    S.hard=nh;save();home();
  });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='final')return play('final');if(S.resume&&S.resume.id===g)return play(g,S.resume);play(g);});
  const _rb=document.querySelector('[data-resume]');if(_rb)_rb.onclick=()=>{const r=S.resume;play(r.id,r);};
  const _rf=document.querySelector('[data-fresh]');if(_rf)_rf.onclick=()=>{const rid=S.resume.id;S.resume=null;save();play(rid);};
  document.getElementById('rs').onclick=()=>askConfirm('모든 진행 기록을 지울까요?','네, 초기화',()=>{S={name:S.name,stars:{},best:{},finalStars:0,finalBest:0,hard:S.hard,hardClear:{},master:{},resume:null};save();home();});
  window.scrollTo(0,0);
}

/* ---------- play ---------- */
function flyScore(x,y,txt){
  const f=document.createElement('div');f.className='fly';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';
  f.style.animation='flyup .9s ease-out forwards';document.body.appendChild(f);setTimeout(()=>f.remove(),900);
}
function play(id,resume){
  const isFinal=id==='final';
  const world=isFinal?null:WORLDS.find(w=>w.id===id);
  const hard=resume?resume.hard:S.hard;   // 이 판의 난이도(이어하기는 저장된 난이도 유지)
  // build concept queue
  let groups,title,pg;
  if(isFinal){
    // one random variant from every group across all worlds, shuffled, pick 14
    const all=WORLDS.flatMap(w=>w.groups);
    groups=hard?all:shuffle(all).slice(0,14);title='빙하 심층 챌린지';pg='종합 · 구간 안내 없음';
  }else{groups=world.groups;title=world.name;pg=(WORLDS.indexOf(world)+1)+'구간 · '+world.pg;}
  const goal=isFinal?'여섯 구간에서 배운 <b class="kw">모든 핵심 개념</b>을, 구간 안내 없이 <b class="kw">스스로 꺼내 쓸 수 있는지</b> 점검한다.':world.goal;
  // 하드: 각 개념의 모든 변형 문항 출제(완전 이해) / 일반: 개념당 변형 1개
  let queue=[];
  if(hard){groups.forEach((g,k)=>g.forEach((_,v)=>queue.push({k,v})));}
  else{queue=groups.map((g,k)=>({k,v:Math.floor(Math.random()*g.length)}));}
  queue=shuffle(queue);
  let total=queue.length;
  const unit=hard?'문항':'개념';
  const seen=new Set();
  const missed=new Set();               // 한 번이라도 틀린 개념(첫 시도 별점 계산용)
  const history=[];                     // 맞힌 문제들(복습용)
  let score=0,combo=0,maxCombo=0,hearts=3,firstTry=0,depthM=0;
  const depthPer=Math.round((isFinal?220:parseInt(world.depth)*-1)/total);
  const histIds=[];
  if(resume){
    queue=resume.order.map(q=>{const a=q.split('_');return{k:+a[0],v:+a[1]};});
    total=resume.total;score=resume.score;combo=resume.combo;maxCombo=resume.maxCombo;
    hearts=resume.hearts;firstTry=resume.firstTry;depthM=resume.depthM;
    resume.missed.forEach(x=>missed.add(x));
    resume.hist.forEach(q=>{const a=q.split('_');history.push(groups[+a[0]][+a[1]]);histIds.push(q);});
  }

  // ===== 하트 소진 연출 =====
  const markDanger=()=>{const qd=document.querySelector('.q');if(qd)qd.classList.add('danger');const hh=document.getElementById('hh');if(hh)hh.classList.add('low');
    const ex=document.getElementById('ex');if(ex)ex.innerHTML=`<div class="exp no"><span class="v">⚠ 위험! 하트 1개</span>한 번만 더 틀리면 집중력이 방전된다. 신중하게!</div>`;};
  const crackFx=()=>{const o=document.createElement('div');o.className='crackfx';o.innerHTML='<span class="crack-sfx">⚡ 집중력 방전!</span>';
    document.body.appendChild(o);document.body.classList.add('quake');setTimeout(()=>{document.body.classList.remove('quake');o.remove();},760);};
  const showRelearn=(it)=>{const ov=document.createElement('div');ov.className='ovl';
    ov.innerHTML=`<div class="dlg relearn"><div class="relearn-tag">⚡ 재충전 전 · 이 개념만 다시 보고 가자</div>
      <p class="relearn-q">${it.q}</p><div class="relearn-exp">${it.e}</div>
      <button class="btn gold" id="_rk">이해했어, 계속 ▶</button></div>`;
    document.body.appendChild(ov);ov.querySelector('#_rk').onclick=()=>{ov.remove();hearts=3;draw();};};
  const hardGameOver=()=>{document.body.classList.remove('focus');
    app.innerHTML=`<div class="intro gameover">
      <div class="intro-sfx" style="color:#FF5C6E">⚠ GAME OVER</div>
      <h1 class="intro-title">집중력 소진!</h1>
      <p class="intro-flavor">하트를 모두 썼다. 하드 모드에서는 이 구간을 처음부터 다시 시추한다.</p>
      <button class="btn gold press" id="_rt">▶ RETRY</button>
      <button class="btn g" id="_bk">← 지도로</button></div>`;
    document.getElementById('_rt').onclick=()=>play(id);
    document.getElementById('_bk').onclick=home;window.scrollTo(0,0);};
  const deplete=(it)=>{if(hard){crackFx();setTimeout(hardGameOver,520);}else{crackFx();setTimeout(()=>showRelearn(it),520);}};
  const snapshot=()=>{if(isFinal)return;S.resume={id,hard,total,order:queue.map(c=>c.k+'_'+c.v),hist:histIds.slice(),score,combo,maxCombo,hearts,firstTry,depthM,missed:[...missed]};save();};

  const draw=()=>{
    document.body.classList.add('focus');
    if(!queue.length)return finish();
    snapshot();
    const c=queue[0],it=groups[c.k][c.v],qid=c.k+'_'+c.v;
    const done=total-queue.length;
    const prog=done/total*100;
    let opts,qText=it.q;
    if(it.t==='mc')opts=shuffle(it.o.map((t,i)=>({t,ok:i===0})));
    else{let ans=it.a;if(it.qn&&Math.random()<0.5){qText=it.qn;ans=!it.a;}opts=shuffle([{t:'O 옳다',ok:ans===true},{t:'X 옳지 않다',ok:ans===false}]);}
    app.innerHTML=`
    <div class="byline play">${BYLINE}</div>
    <div class="hud">
      <span class="hearts" id="hh">${'❤'.repeat(hearts)}${'<span style=opacity:.25>❤</span>'.repeat(3-hearts)}</span>
      <span class="sc">${score}</span>
      <span class="dp"><b>${depthM}m</b><br>${title}${hard?' <span class="hardchip">⚔ 하드</span>':''}</span>
    </div>
    <div class="pbar"><i style="width:${prog}%"></i></div>
    <div class="goal play"><span class="ic">🎯</span><span><span class="lb">학습 목표</span> · ${goal}</span></div>
    <div class="combo" id="cb"></div>
    <div class="q">
      <div class="qtag">${isFinal?'심층':pg} · ${unit} ${done}/${total} 돌파</div>
      ${glossFor(it)}
      <div class="qtxt">${qText}</div>
      <div class="opts ${it.t==='ox'?'ox':''}" id="op">
        ${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`).join('')}
      </div>
      <div id="ex"></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn g" id="prev" style="padding:6px 14px" ${history.length?'':'disabled'}>◂ 이전 문제</button>
      <button class="btn g" id="quit" style="padding:6px 14px">그만두고 지도로</button>
    </div>`;
    if(combo>=2){const cb=document.getElementById('cb');cb.innerHTML=`<span class="pop">🔥 ${combo} 연속! 점수 x${(1+Math.min(combo-1,4)*0.5).toFixed(1)}</span>`;}
    document.getElementById('quit').onclick=()=>askConfirm('시추를 멈추고 지도로 돌아갈까요?<br><span class="sub">이 구간 점수는 저장되지 않습니다.</span>','네, 지도로',home);
    const pv=document.getElementById('prev');if(pv&&history.length)pv.onclick=()=>review(history.length-1);
    let wrongHere=false;                 // 이 문제에서 한 번이라도 틀렸는지
    const renderHearts=()=>{const hh=document.getElementById('hh');if(hh)hh.innerHTML='❤'.repeat(hearts)+'<span style=opacity:.25>❤</span>'.repeat(3-hearts);};
    document.querySelectorAll('#op .opt').forEach(b=>b.onclick=()=>{
      if(b.disabled)return;
      const o=opts[+b.dataset.i];
      if(o.ok){
        // 정답 — 모든 보기 잠그고 해설, 다음으로
        document.querySelectorAll('#op .opt').forEach(x=>x.disabled=true);
        b.classList.add('ok');
        combo++;maxCombo=Math.max(maxCombo,combo);
        const mult=1+Math.min(combo-1,4)*0.5;
        const gain=wrongHere?50:Math.round(100*mult);   // 틀린 뒤 맞히면 절반 점수
        score+=gain;depthM+=depthPer;
        if(!missed.has(qid))firstTry++;
        const r=b.getBoundingClientRect();flyScore(r.right-60,r.top-6,'+'+gain);
        queue.shift();history.push(it);histIds.push(qid);
        showExp(true,it.e,wrongHere?'다시 골라 맞혔다. 점수 절반 획득.':'');
      }else{
        // 오답 — 이 보기만 비활성화, 정답은 숨긴 채 재선택
        b.classList.add('no');b.disabled=true;
        const qd=document.querySelector('.q');qd.classList.remove('shake');void qd.offsetWidth;qd.classList.add('shake');
        if(!wrongHere){wrongHere=true;combo=0;const cb=document.getElementById('cb');if(cb)cb.innerHTML='';}
        missed.add(qid);
        hearts--;renderHearts();
        if(hearts<=0){deplete(it);return;}
        if(hearts===1){markDanger();return;}
        document.getElementById('ex').innerHTML=`<div class="exp no"><span class="v">다시 ⛏</span>아니다. 남은 보기에서 다시 골라 보자. (하트 ${hearts}개 남음)</div>`;
      }
    });
    window.scrollTo(0,0);
  };
  const showExp=(ok,e,extra)=>{
    document.getElementById('ex').innerHTML=`<div class="exp ${ok?'ok':'no'}">
      <span class="v">${ok?'정확하다! ⛏':'다시 내려가자'}</span>${e}${extra?'<br><b>'+extra+'</b>':''}</div>
      <button class="btn next" id="nx">${queue.length?'계속 시추 ▸':'코어 확인 ▸'}</button>`;
    const n=document.getElementById('nx');n.onclick=draw;n.focus();
  };
  const review=(i)=>{
    const it=history[i];
    const opts=it.t==='mc'?it.o.map((t,k)=>({t,ok:k===0})):[{t:'O 옳다',ok:it.a===true},{t:'X 옳지 않다',ok:it.a===false}];
    app.innerHTML=`
    <div class="revbar"><b>📘 지나간 문제 복습</b><span class="sub">${i+1} / ${history.length}</span></div>
    <div class="q">
      <div class="qtag">이미 맞힌 문제 · 정답과 해설</div>
      ${glossFor(it)}
      <div class="qtxt">${it.q}</div>
      <div class="opts ${it.t==='ox'?'ox':''}">
        ${opts.map((o,k)=>`<button class="opt ${o.ok?'ok':''}" disabled><span class="k">${String.fromCharCode(65+k)}</span><span>${o.t}</span></button>`).join('')}
      </div>
      <div class="exp ok"><span class="v">정답 해설</span>${it.e}</div>
    </div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn g" id="rp" style="padding:6px 14px" ${i<=0?'disabled':''}>◂ 이전</button>
      <button class="btn g" id="rn" style="padding:6px 14px" ${i>=history.length-1?'disabled':''}>다음 ▸</button>
      <button class="btn gold" id="rb" style="padding:6px 14px">현재 문제로 ▸</button>
    </div>`;
    const g=id=>document.getElementById(id);
    if(i>0)g('rp').onclick=()=>review(i-1);
    if(i<history.length-1)g('rn').onclick=()=>review(i+1);
    g('rb').onclick=draw;
    window.scrollTo(0,0);
  };
  const finish=()=>{
    document.body.classList.remove('focus');
    const stars=firstTry===total?3:firstTry>=Math.ceil(total*0.7)?2:1;
    const key=isFinal?'final':id;
    if(isFinal){S.finalStars=Math.max(S.finalStars,stars);S.finalBest=Math.max(S.finalBest,score);}
    else{S.stars[id]=Math.max(S.stars[id]||0,stars);S.best[id]=Math.max(S.best[id]||0,score);
      if(hard){S.hardClear[id]=true;if(firstTry===total)S.master[id]=true;}
      S.resume=null;}
    save();
    const idx=isFinal?-1:WORLDS.findIndex(w=>w.id===id);
    const nxt=isFinal?null:WORLDS[idx+1];
    app.innerHTML=`
    <div class="clear-c">
      <div class="clear-sfx">${isFinal?'ALL CLEAR!':'STAGE CLEAR!'}</div>
      <div class="big">${isFinal?'심층 도달 🏆':'구간 돌파!'}</div>
      <div class="starline">${starStr(stars)}</div>
      <p class="sub">${stars===3?'한 번도 안 틀렸다. 완벽한 코어!':stars===2?'거의 완벽. 아래 코어를 복습해 두자.':'돌파 성공. 틀렸던 개념을 한 번 더 보자.'}</p>
      ${hard?`<div class="mastery">⭐ 완전 이해 패스 — 이 ${isFinal?'단원':'구간'}의 <b>모든 변형 문항(${total})</b>을 스스로 풀어냈다.<br>이제 어떤 각도로 물어도 설명할 수 있다.</div>`:''}
      <div class="goal" style="text-align:left"><span class="ic">✅</span><span><span class="lb">이번에 달성한 목표</span> · ${goal}</span></div>
      <table class="stat">
        <tr><td>획득 점수</td><td>${score}점</td></tr>
        <tr><td>처음에 맞힌 ${unit}</td><td>${firstTry}/${total}</td></tr>
        <tr><td>최고 콤보</td><td>🔥 ${maxCombo}</td></tr>
        <tr><td>도달 깊이</td><td>${depthM}m</td></tr>
      </table>
      ${!isFinal&&clearedCount()>=6?`<div class="mastery">🏴 여섯 구간을 모두 돌파했다! 이제 <b>전 구간 개념이 뒤섞인 ‘빙하 심층 챌린지’</b>에 도전할 수 있다.<br>아래 버튼으로 바로 가거나, 지도에서 나중에 골라도 된다.</div>`:''}
      <div class="row" style="justify-content:center">
        ${nxt&&unlocked(idx+1)?`<button class="btn gold" id="go">다음 구간 ▾</button>`:''}
        ${!isFinal&&clearedCount()>=6?`<button class="btn gold" id="chal">🏴 심층 챌린지 ▾</button>`:''}
        ${isFinal&&clearedCount()>=6?`<button class="btn gold" id="cert">완료증 보기</button>`:''}
        <button class="btn g" id="again">다시 시추</button>
        <button class="btn g" id="map">지도로</button>
      </div>
    </div>`;
    if(nxt&&unlocked(idx+1))document.getElementById('go').onclick=()=>play(nxt.id);
    {const _ch=document.getElementById('chal');if(_ch)_ch.onclick=()=>play('final');}
    document.getElementById('again').onclick=()=>play(id);
    document.getElementById('map').onclick=home;
    if(isFinal&&clearedCount()>=6)document.getElementById('cert').onclick=cert;
    window.scrollTo(0,0);
  };
  // 구간 시작: 만화풍 퀘스트 브리핑(전두엽 목표 설정) → PRESS START → 집중 모드 문제
  const startQuiz=()=>{document.body.classList.add('focus');draw();};
  const showIntro=()=>{
    document.body.classList.remove('focus');
    const lvl=isFinal?'FINAL BOSS':'LEVEL '+(WORLDS.indexOf(world)+1);
    const flavor=isFinal?'여섯 구간의 개념이 뒤섞여 밀려온다. 어느 단원인지 알려 주지 않는다.':'코어를 시추하기 전, 이번 층에서 무엇을 캐낼지 머릿속에 먼저 그려 두자.';
    app.innerHTML=`
    <div class="intro">
      <div class="intro-sfx">${lvl}${hard?' <span class="hardchip">⚔ 하드 모드</span>':''}</div>
      <h1 class="intro-title">${title}</h1>
      <p class="intro-flavor">${flavor}${hard?`<br><b style="color:#FFD23F">⭐ 하드 · 모든 변형 ${total}문항을 풀어야 완주 — 완전 이해에 도전한다.</b>`:''}</p>
      <div class="intro-quest"><span class="lb">QUEST · 이번 목표</span>${goal}</div>
      <div class="intro-hp"><span>집중력</span><div class="hpbar"><i></i></div><span>100%</span></div>
      <button class="btn gold press" id="start">▶ PRESS START</button>
      <button class="btn g" id="back">← 지도로</button>
    </div>`;
    document.getElementById('start').onclick=startQuiz;
    document.getElementById('back').onclick=home;
    window.scrollTo(0,0);
  };
  if(resume){startQuiz();}else{showIntro();}
}

function cert(){
  const rows=WORLDS.map((w,i)=>`<tr><td>${i+1}. ${w.name}</td><td>${S.stars[w.id]?starStr(S.stars[w.id])+' · '+(S.best[w.id]||0):'미완료'}</td></tr>`).join('');
  const totalStar=WORLDS.reduce((a,w)=>a+(S.stars[w.id]||0),0)+S.finalStars;
  app.innerHTML=`<div class="cert">
    <h2>시추 완료증</h2>
    <p style="font-size:1.1rem;font-weight:700">${esc(S.name)||'(이름을 지도에서 입력하세요)'}</p>
    <div class="starline" style="font-size:1.8rem">${'★'.repeat(totalStar)}</div>
    <p class="sub">모은 별 ${totalStar}/21</p>
    <table class="stat">${rows}<tr><td>빙하 심층 챌린지</td><td>${S.finalStars?starStr(S.finalStars)+' · '+S.finalBest:'미완료'}</td></tr></table>
    ${(()=>{const m=WORLDS.filter(w=>S.master&&S.master[w.id]);return m.length?`<div class="mastery">⭐ 완전 이해 마스터 — <b>${m.map(w=>w.name).join(', ')}</b> 구간을 하드·무결점으로 돌파!</div>`:'';})()}
    <p class="sub">${new Date().toLocaleDateString('ko-KR')} 도달</p>
    <button class="btn g" id="bk" style="margin-top:10px">지도로</button>
  </div>`;
  document.getElementById('bk').onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
